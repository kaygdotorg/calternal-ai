[package]
name = "calternal-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Keep debug-only test-plugin stage markers.
test-timings = ["calternal-types/perf-clock"]
# Also compile the same journal marker in optimized builds.
perf-timings = ["test-timings", "rusqlite/trace"]

[dependencies]
calternal-types.workspace = true
blake3.workspace = true
calternal-fsio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
