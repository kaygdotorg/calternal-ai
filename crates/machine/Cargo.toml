[package]
name = "calternal-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Calternal-AI machine role: enrolment, the outbound connection to the server, and per-thread sandboxes"

[dependencies]
calternal-types.workspace = true
calternal-fsio.workspace = true
calternal-store.workspace = true
rusqlite.workspace = true
calternal-cli.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
reqwest.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false }
clap.workspace = true
tokio = { workspace = true, features = ["process", "sync", "signal", "fs", "net"] }
ring.workspace = true
base64.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["process"] }

tempfile.workspace = true

[dev-dependencies]
calternal-cli = { workspace = true, features = ["testing"] }
time.workspace = true
