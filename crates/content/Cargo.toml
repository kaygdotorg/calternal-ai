[package]
name = "calternal-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
perf-timings = ["calternal-store/perf-timings"]

[dependencies]
calternal-types.workspace = true
calternal-fsio.workspace = true
calternal-roots.workspace = true
calternal-store.workspace = true
rusqlite = { workspace = true, features = ["blob", "functions"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid = { workspace = true, features = ["v7"] }
tokio = { workspace = true, features = ["sync"] }
blake3.workspace = true
tracing.workspace = true
time = { workspace = true, features = ["formatting", "macros", "parsing"] }

similar = "3.2.0"
unicode-segmentation = "1.13.3"
yrs = { version = "0.28", features = ["sync"] }

[dev-dependencies]
tempfile.workspace = true
