[package]
name = "calternal-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Reused, not new: private 0600/0700 file helpers, typed owner IDs and the
# entropy helper come from the ported auth crate.
calternal-auth.workspace = true
calternal-fsio.workspace = true
# Same AES-256-GCM primitive as the existing app's invite key; openssl is
# already in the lock file through webauthn-rs.
openssl = "0.10.82"
blake3 = "1.8.7"
# Already in the lock file; wipes plaintext buffers on drop.
zeroize = "1.9.1"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }
serde.workspace = true

[dev-dependencies]
tempfile = "3.27"
