[package]
name = "calternal-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
calternal-types.workspace = true
# Same version the auth crate already uses for its entropy.
getrandom.workspace = true
calternal-fsio.workspace = true
# Same AES-256-GCM primitive as the existing app's invite key; openssl is
# already in the lock file through webauthn-rs.
openssl = "0.10.82"
blake3.workspace = true
# Already in the lock file; wipes plaintext buffers on drop.
zeroize = "1.9.1"
rusqlite.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }
serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
