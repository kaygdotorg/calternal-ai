[package]
name = "calternal-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Calternal-AI localhost development-preview host (disposable data only)"

[[bin]]
name = "calternal"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Expose pure file projection to the locked performance runner.
rebuild-probe = []
# Trust the test-only plugins under tests/plugins (never in a shipped build).
test-plugins = ["calternal-store/test-timings"]
# Enable release journal timing without trusting test plugins.
perf-timings = ["calternal-store/perf-timings"]
# Local-only authoring transport. Never enabled in the shipped binary.
dev-plugin-drafts = []

[dependencies]
arc-swap = "1.9.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
calternal-types.workspace = true
calternal-content.workspace = true
calternal-store.workspace = true
calternal-roots.workspace = true
calternal-recovery.workspace = true
rustix = { workspace = true, features = ["process"] }
calternal-auth.workspace = true
calternal-fsio.workspace = true
calternal-core.workspace = true
calternal-genui.workspace = true
calternal-plugin-host.workspace = true
calternal-machine.workspace = true
calternal-cli.workspace = true
calternal-client.workspace = true
calternal-secrets.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["process", "sync", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tower-http = { version = "0.7", features = ["fs"] }
rusqlite.workspace = true
hex.workspace = true
subtle = "2"
getrandom.workspace = true
time = { workspace = true, features = ["formatting", "macros"] }
tracing.workspace = true
# Already in the dependency tree through axum; used for the SSE body stream.
futures-util = { version = "0.3", default-features = false }
ring.workspace = true
base64.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

reqwest.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

webauthn-authenticator-rs.workspace = true
webauthn-rs.workspace = true
tempfile.workspace = true
calternal-cli = { workspace = true, features = ["testing"] }
url.workspace = true
