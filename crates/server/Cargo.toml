[package]
name = "calternal-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Calternal-AI localhost development-preview host (disposable data only)"

[[bin]]
name = "calternal"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
calternal-content.workspace = true
calternal-roots.workspace = true
calternal-auth.workspace = true
calternal-fsio.workspace = true
calternal-core.workspace = true
calternal-plugin-host.workspace = true
calternal-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["process", "sync", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower-http = { version = "0.7", features = ["fs"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
subtle = "2"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
tempfile = "3.27"
url = "2.5.8"
