[package]
name = "calternal-conformance"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone suite with its own HTTP/software-authenticator fixture dependencies.
[workspace]

[features]
release-upgrade = []
# First real Chat run on the v2 host; fails at the first missing seam (#101).
chat-v2 = []

[dependencies]
base64 = "0.23.1"
calternal-auth = { path = "../../crates/auth" }
calternal-machine = { path = "../../crates/machine" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3.27"
tungstenite = "0.29.0"
url = "2.5.8"
uuid = { version = "1", features = ["v7"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
yrs = { version = "0.28", features = ["sync"] }

[[test]]
name = "isolation"
path = "isolation.rs"
