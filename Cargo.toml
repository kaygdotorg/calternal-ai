[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
calternal-content = { path = "crates/content" }
calternal-plugin-host = { path = "crates/plugin-host" }
calternal-recovery = { path = "crates/recovery" }
calternal-store = { path = "crates/store" }
calternal-auth = { path = "crates/auth" }
calternal-secrets = { path = "crates/secrets" }
calternal-fsio = { path = "crates/fsio" }
calternal-roots = { path = "crates/roots" }
calternal-core = { path = "crates/core" }
calternal-client = { path = "crates/client" }
calternal-machine = { path = "crates/machine" }
calternal-types = { path = "crates/types" }
calternal-cli = { path = "crates/cli" }
calternal-genui = { path = "crates/genui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0"
percent-encoding = "2"
schemars = "0.8"
ts-rs = { version = "10", features = ["serde-json-impl"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
# One declaration per shared dependency; crates add features with `.workspace = true`.
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.4.3"
rustix = "1.1.5"
blake3 = "1.8.7"
tracing = "0.1.44"
time = "0.3"
base64 = "0.23.1"
ring = "0.17"
hex = "0.4"
url = "2.5.8"
unicode-normalization = "0.1.25"
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
tempfile = "3.27"
