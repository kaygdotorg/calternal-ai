# Throwaway spike of the primitives-only host's step 1 (issue #107).
# Its own workspace so it never changes the product workspace or a product crate.
[package]
name = "host-spike"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
calternal-types = { path = "../../crates/types" }
calternal-fsio = { path = "../../crates/fsio" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
blake3 = "1.8.7"
uuid = { version = "1", features = ["v4", "v7"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.27"
